name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Verify lock and generated pip exports
        run: |
          uv lock --check
          uv export --locked --no-header --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uv export --locked --no-header --no-emit-project --format requirements-txt --output-file /tmp/requirements-dev.txt
          uv export --locked --no-header --no-dev --group build --no-emit-project --format requirements-txt --output-file /tmp/requirements-build.txt
          diff -u requirements.txt /tmp/requirements.txt
          diff -u requirements-dev.txt /tmp/requirements-dev.txt
          diff -u requirements-build.txt /tmp/requirements-build.txt

      - name: Install locked development environment
        run: uv sync --locked

      - name: Verify two clean runtime environments install identically
        run: uv run --locked python scripts/verify_locked_install.py --python 3.11

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Prompt validation
        run: uv run --locked python scripts/prompt_ci/validate_prompts.py

      - name: Mypy
        run: uv run --locked mypy src

      - name: Pytest
        # smoke_test.py is a manual integration harness (needs data fixtures /
        # live services); it is excluded from the automated gate.
        run: >-
          uv run --locked pytest tests/ --ignore=tests/smoke_test.py
          --cov=src --cov-report=term --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json --cov-fail-under=60

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
